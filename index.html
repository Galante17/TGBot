<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка Медиа HQ</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #182533);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #202b36);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        h2 { margin-top: 0; color: var(--tg-theme-button-color, #40a7e3); }
        input[type="file"] { display: none; }
        .file-label {
            display: inline-block;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 15px 0;
            transition: background 0.2s;
        }
        .file-label:hover { opacity: 0.9; }
        #status { font-size: 14px; margin-top: 10px; color: #aaa; }
    </style>
</head>
<body>

<div class="card">
    <h2>Медиа Панель HQ</h2>
    <p>Выберите тяжелое фото или видео для отправки в оригинальном качестве</p>
    
    <label for="file-upload" class="file-label">Выбрать файл</label>
    <input id="file-upload" type="file" accept="image/*,video/*" onchange="handleFile(this)">
    
    <div id="status">Файл не выбран</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function handleFile(input) {
        const file = input.files[0];
        if (!file) return;

        const statusDiv = document.getElementById('status');
        statusDiv.innerText = `Чтение: ${file.name}...`;

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Data = e.target.result;
            
            // Формируем объект для отправки боту
            const payload = {
                filename: file.name,
                type: file.type,
                data: base64Data
            };

            statusDiv.innerText = "Отправка в бот...";
            
            // Отправляем данные обратно в чат боту
            tg.sendData(JSON.stringify(payload));
            
            // Закрываем мини-приложение через секунду
            setTimeout(() => { tg.close(); }, 1000);
        };
        
        reader.onerror = function() {
            statusDiv.innerText = "Ошибка чтения файла";
        };

        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
